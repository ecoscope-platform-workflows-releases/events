name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize, labeled, unlabeled]

jobs:
  parse-test-cases:
    runs-on: ubuntu-latest
    outputs:
      cases: ${{ steps.parse.outputs.cases }}
      first_case: ${{ steps.parse.outputs.first_case }}
      release_dir: ${{ steps.parse.outputs.release_dir }}
      case_flags: ${{ steps.parse.outputs.case_flags }}

    steps:
      - uses: actions/checkout@v7
      - name: Parse test cases
        id: parse
        run: |
          # Discover release directory
          shopt -s nullglob
          dirs=(*-workflow/)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "Error: no *-workflow directory found" >&2; exit 1
          elif [ ${#dirs[@]} -gt 1 ]; then
            echo "Error: multiple *-workflow directories found: ${dirs[*]}" >&2; exit 1
          fi
          echo "release_dir=${dirs[0]%/}" >> $GITHUB_OUTPUT

          # Fail if no test cases defined
          keys=$(yq -o=json -I=0 'keys' test-cases.yaml)
          if [ "$keys" = "[]" ] || [ "$keys" = "null" ]; then
            echo "::error::test-cases.yaml has no test cases defined" && exit 1
          fi
          # Fail if any case is missing .params
          for case in $(yq 'keys | .[]' test-cases.yaml); do
            params=$(yq ".[\"$case\"].params" test-cases.yaml)
            if [ "$params" = "null" ]; then
              echo "::error::test case '$case' is missing required 'params' field" && exit 1
            fi
          done

          flags=""
          for case in $(yq 'keys | .[]' test-cases.yaml); do
            flags+="--case $case "
          done
          echo "case_flags=${flags% }" >> $GITHUB_OUTPUT

          echo "cases=$keys" >> $GITHUB_OUTPUT
          echo "first_case=$(yq 'keys | .[0]' test-cases.yaml)" >> $GITHUB_OUTPUT

  test:
    needs: parse-test-cases
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        case: ${{ fromJSON(needs.parse-test-cases.outputs.cases) }}
        include:
          - os: ubuntu-latest
            workdir: .
          # Windows checks out into a deeply nested directory so the pixi env's
          # own files land past MAX_PATH (260). That reproduces what users hit
          # when this repo is cloned somewhere deep on disk: without long-path
          # support, resolving site-packages fails and python can't import.
          # The job asserts long-path support is on, so a green run proves the
          # code works in that layout *given the registry fix*.
          #
          # test_iframes screenshots widgets in a headless browser; the PNG
          # snapshots are Linux-generated and don't render identically on
          # Windows, so deselect it there.
          - os: windows-latest
            workdir: long-path-regression-guard-000/long-path-regression-guard-001/long-path-regression-guard-002/long-path-regression-guard-003/long-path-regression-guard-004
            extra_pytest_args: --deselect tests/test_results.py::test_iframes

    steps:
      - name: Ensure long-path support
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The runner image already sets LongPathsEnabled=1 (see
          # images/windows/scripts/build/Configure-BaseImage.ps1 in
          # actions/runner-images), so this write is normally a no-op. It is
          # here so the precondition holds on runners that aren't the hosted
          # windows-latest image, and so the assert below catches a silent
          # failure rather than surfacing as a confusing import error later.
          $key = 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem'
          $before = (Get-ItemProperty -Path $key -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "LongPathsEnabled (runner image default): $before"
          Set-ItemProperty -Path $key -Name LongPathsEnabled -Value 1 -Type DWord
          $after = (Get-ItemProperty -Path $key -Name LongPathsEnabled).LongPathsEnabled
          Write-Host "LongPathsEnabled (now): $after"
          if ($after -ne 1) { throw "LongPathsEnabled is '$after', expected 1" }
          # This one is load-bearing: the image does NOT set core.longpaths,
          # and Git for Windows ignores the registry key in favour of its own
          # config. The checkout below is ~274 chars at its deepest tracked
          # file, so without this git fails with "Filename too long".
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          path: ${{ matrix.workdir }}
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false
      - name: Install environment
        working-directory: ${{ matrix.workdir }}
        run: >-
          pixi install
          --manifest-path ${{ needs.parse-test-cases.outputs.release_dir }}/pixi.toml
          --locked -e test
      - name: Assert the checkout clears MAX_PATH
        # Without this the long-path leg could silently degrade into an
        # ordinary test run if the nesting above ever stops being deep enough.
        if: runner.os == 'Windows'
        shell: python
        env:
          WORKDIR: ${{ matrix.workdir }}
        run: |
          import os, sys

          root = os.path.abspath(os.environ["WORKDIR"])
          longest = max(
              (os.path.join(d, f) for d, _, fs in os.walk(root) for f in fs),
              key=len,
              default=root,
          )
          print(f"checkout root ({len(root)} chars): {root}")
          print(f"longest path  ({len(longest)} chars): {longest}")
          if len(longest) <= 260:
              sys.exit(
                  f"::error::longest path is {len(longest)} chars; it must exceed "
                  "260 for this leg to exercise long-path support"
              )
      - name: Test
        working-directory: ${{ matrix.workdir }}
        run: >-
          pixi run
          --manifest-path ${{ needs.parse-test-cases.outputs.release_dir }}/pixi.toml
          --locked -e test
          test-app-sequential-mock-io
          --case ${{ matrix.case }}
          ${{ matrix.extra_pytest_args }}
      - name: Upload failed snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-snapshot-diffs-${{ matrix.os }}-${{ matrix.case }}
          path: ${{ matrix.workdir }}/__diff_output__/
          if-no-files-found: error

  docker:
    needs: parse-test-cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH
      - name: Set CI variables
        run: |
          echo "RELEASE_DIR=${{ needs.parse-test-cases.outputs.release_dir }}" >> $GITHUB_ENV
          echo "CI_TEST_CASE=${{ needs.parse-test-cases.outputs.first_case }}" >> $GITHUB_ENV
      - name: Docker build + run
        run: |
          pixi run --manifest-path $RELEASE_DIR/pixi.toml --locked -e default docker-build
          docker run --name $RELEASE_DIR -d \
            -v $(pwd)/.wt-tmp/$RELEASE_DIR-results:/workflow/results \
            -e PORT=4000 -p 4000:4000 $RELEASE_DIR
          sleep 5
          docker ps
      - name: Invoke container with curl
        run: |
          params=$(yq -o=json -I=0 ".[\"$CI_TEST_CASE\"].params" test-cases.yaml)
          curl --fail-with-body \
            -X POST "http://localhost:4000/?execution_mode=sequential&mock_io=true&results_url=/workflow/results" \
            -H "Content-Type: application/json" \
            -d '{"params": '"${params}"'}'

  snapshot-update:
    needs: parse-test-cases
    if: |
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'snapshot-update')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: snapshot-update-${{ github.head_ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Install pixi
        run: curl -fsSL https://pixi.sh/install.sh | bash && echo "$HOME/.pixi/bin" >> $GITHUB_PATH
      - name: Set CI variables
        run: |
          echo "RELEASE_DIR=${{ needs.parse-test-cases.outputs.release_dir }}" >> $GITHUB_ENV
      - name: Update snapshots
        run: >-
          pixi run --manifest-path $RELEASE_DIR/pixi.toml
          --locked -e test
          test-app-sequential-mock-io
          ${{ needs.parse-test-cases.outputs.case_flags }}
          --snapshot-update
      - name: Commit and push snapshot changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add __results_snapshots__/
          git commit -m "auto: snapshot update"
          git push origin HEAD:${{ github.head_ref }}

  recompile-workflows:
    needs: parse-test-cases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          run-install: false

      - name: Install compiler
        run: pixi global install wt-compiler --channel https://prefix.dev/ecoscope-workflows --channel conda-forge

      - name: Recompile workflow
        run: |
          wt-compiler compile \
            --spec spec.yaml \
            --pkg-name-prefix=ecoscope-workflows \
            --results-env-var=ECOSCOPE_WORKFLOWS_RESULTS \
            --variant=gcp \
            --no-progress \
            --clobber --update

      - name: Check for differences in generated files
        run: |
          WORKFLOW_DIR_NAME="${{ needs.parse-test-cases.outputs.release_dir }}"
          EXCLUDE_PATTERNS=":(exclude)${WORKFLOW_DIR_NAME}/pixi.lock :(exclude)${WORKFLOW_DIR_NAME}/README.md :(exclude)${WORKFLOW_DIR_NAME}/VERSION.yaml :(exclude)${WORKFLOW_DIR_NAME}/graph.png"

          echo "Checking for differences in ${WORKFLOW_DIR_NAME}"

          if [ ! -d "${WORKFLOW_DIR_NAME}" ]; then
            echo "::error::Generated directory ${WORKFLOW_DIR_NAME} does not exist!"
            exit 1
          fi

          # Exclude auto-generated files: pixi.lock (dependency resolution), VERSION.yaml (auto-versioned), graph.png (binary)
          if ! git diff --exit-code -- "${WORKFLOW_DIR_NAME}" ${EXCLUDE_PATTERNS}; then
            echo ""
            echo "::error::Generated files differ from committed files in ${WORKFLOW_DIR_NAME}"
            echo "::error::Please run the compilation locally and commit the changes."
            exit 1
          else
            echo "No differences found - generated files are up to date!"
          fi

      - name: Validate excluded files exist
        run: |
          WORKFLOW_DIR_NAME="${{ needs.parse-test-cases.outputs.release_dir }}"
          errors=0

          for file in pixi.lock VERSION.yaml README.md; do
            if [ ! -f "${WORKFLOW_DIR_NAME}/${file}" ]; then
              echo "::error::${WORKFLOW_DIR_NAME}/${file} does not exist!"
              errors=$((errors + 1))
            else
              echo "OK: ${WORKFLOW_DIR_NAME}/${file}"
            fi
          done

          if [ $errors -gt 0 ]; then
            exit 1
          fi
